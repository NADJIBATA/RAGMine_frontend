<div class="h-full relative flex-1 flex flex-col items-center justify-center p-8 text-center">
  <img [src]="mascotteBonjour" class="w-16 h-20 flex items-center justify-center mb-4" />

  <h3 class="text-2xl font-bold text-murata-dark dark:text-gray-100 mb-2">
    Bonjour {{ firstname }} 👋
  </h3>
  <p class="text-gray-400 dark:text-gray-100 text-sm mb-8 max-w-sm">
    Je suis RAGmine, votre assistant Redmine intelligent.<br />
    Posez-moi une question sur vos projets, tickets ou wiki.
  </p>

  <div class="flex flex-wrap gap-2 justify-center max-w-lg">
    <button
      *ngFor="let s of suggestions"
      (click)="onSelect(s.text)"
      class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-full px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:border-murata-red hover:text-murata-red dark:hover:border-blue-400 dark:hover:text-blue-400 hover:shadow-md transition cursor-pointer"
    >
      {{ s.icon }} {{ s.text }}
    </button>
  </div>
</div>
