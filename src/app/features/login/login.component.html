<div class="min-h-screen bg-[#f7fafc] flex flex-col">
  <header class="bg-white h-16 flex items-center justify-between px-6 shadow-md dark:bg-gray-800 w-full ">

    <div class="flex items-center text-[rgb(0,107.5304347826,229)] font-bold text-3xl justify-center items-center">
      <img [src]="redmineLogo" class="h-12 w-12 text-[rgb(0,107.5304347826,229)] dark:text-white relative b-12" />
      <p class="text-[27px] text-gray-800 mx-2 dark:text-white">RAGMine</p>
    </div>

    <button
        (click)="toggleTheme()"
        [title]="theme.isDark() ? 'Mode clair' : 'Mode sombre'"
        class="mr-4 bg-[#f4f6f8] dark:bg-gray-700 border border-[#e7eaef] dark:border-gray-600 hover:bg-white dark:text-white dark:hover:bg-gray-600 p-2 rounded-lg shadow-sm transition flex items-center justify-center w-10 h-10"
      >
        <ng-icon *ngIf="theme.isDark()" name="lucideSun" class="text-xl text-gray-700 w-[15px] h-[15px]"></ng-icon>
        <ng-icon *ngIf="!theme.isDark()" name="lucideMoon" class="text-xl text-yellow-300"></ng-icon>
    </button>

  </header>

  <div class="flex-1 flex items-center justify-center p-6 dark:bg-gray-900 ">
    <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md dark:bg-gray-700">

      <div class="relative w-full mb-8 flex flex-col items-center">
        <img [src]="mascotteBonjour" class="w-16 h-20 mb-4 text-center dark:text-white dark:color-white" />
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Connexion</h2>
        <p class="text-gray-400 text-sm mt-1 dark:text-gray-400">
          Connectez-vous avec votre compte Redmine
        </p>
      </div>

      <div *ngIf="error" class="bg-red-50 border border-red-200 text-[#E60012] rounded-lg px-4 py-3 text-sm mb-5">
        {{ error }}
      </div>

      <form (ngSubmit)="handleSubmit()" class="space-y-5">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5 dark:text-white">
            Login Redmine
          </label>
          <input
            type="text"
            [(ngModel)]="loginVal"
            name="loginVal"
            placeholder="MISXXXXX"
            required
            class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#006ce5]/2 transition dark:text-white"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5 dark:text-white">
            Mot de passe
          </label>
          <div class="w-full flex justify-between items-center rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#006ce5]/5 transition border border-gray-200 pr-4">
            <input
              [type]="passwordType"
              [(ngModel)]="password"
              name="password"
              required
              class="relative w-[90%] px-4 py-3 text-sm outline-none border-0 rounded-l-lg dark:text-white"
            />
            <button
              type="button"
              (click)="togglePasswordType()"
              class="w-4 flex items-center text-gray-400 hover:text-[#E60012] transition"
              tabindex="-1"
            >
              <span *ngIf="passwordType === 'password'"><img [src]="eye" class="w-4 h-4 dark:invert"  /></span>
              <span *ngIf="passwordType === 'text'"><img [src]="hide" class="w-4 h-4 dark:invert" /></span>
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-[rgb(0,107.5304347826,229)] hover:bg-[rgb(0,90,190)] text-white font-semibold py-3 rounded-lg transition disabled:bg-gray-300 disabled:cursor-not-allowed shadow-sm hover:shadow-md"
        >
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
            Connexion en cours...
          </span>
          <span *ngIf="!loading">Se connecter</span>
        </button>
      </form>

      <p class="text-center text-xs text-gray-300 mt-8">
        RAGMine v1.0 - Murata Integrated Passive Solutions
      </p>
    </div>
  </div>
</div>
