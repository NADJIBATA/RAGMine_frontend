<div class="password-input-wrapper">
  <input
    [type]="showPassword ? 'text' : 'password'"
    [value]="value"
    (input)="onInput($any($event.target).value)"
    (blur)="onTouched()"
    [disabled]="disabled"
  />
  <button type="button" (click)="toggleVisibility()" tabindex="-1">
    {{ showPassword ? '🙈' : '👁️' }}
  </button>
</div>
